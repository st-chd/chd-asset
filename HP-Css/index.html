<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS 모음</title>
<meta name="description" content="챗달 전용 CSS 코드 모음">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%232457E0%22/><text x=%2250%22 y=%2268%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22>{}</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
      <div class="brand-text">
        <h1>CSS 모음</h1>
        <p>📱💬캐릭터 ai 채팅 드림달글(2d/2.5d전용)</p>
      </div>
    </div>
    <button class="filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="sidebar">
      <span class="filter-toggle-icon" aria-hidden="true"></span>
      필터
    </button>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <line x1="16.65" y1="16.65" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input type="text" id="searchInput" placeholder="제목, 카테고리, 태그, 확장으로 검색하세요." autocomplete="off">
      <button id="searchClear" class="search-clear" aria-label="검색어 지우기" hidden>&times;</button>
    </div>
    <div class="result-count" id="resultCount"></div>
  </div>
</header>

<section class="notice-banner" id="noticeBanner" hidden>
  <div class="notice-inner">
    <span class="notice-icon" aria-hidden="true">!</span>
    <div class="notice-content">
      <p id="noticeText"></p>
    </div>
    <button class="notice-toggle" id="noticeToggle" hidden>더 보기</button>
  </div>
</section>

<div class="layout">
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <aside class="sidebar" id="sidebar">
        <button class="reset-btn" id="resetFilters">&gt;&gt; 검색 및 필터 초기화</button>
    <div class="sidebar-section">
      <h2>확장 프로그램</h2>
      <div class="chip-row" id="extensionChips"></div>
    </div>
        <div class="sidebar-section">
      <h2>카테고리</h2>
      <ul class="category-list" id="categoryList"></ul>
    </div>
    <div class="sidebar-section">
      <h2>환경</h2>
      <div class="chip-row" id="deviceChips"></div>
    </div>

  </aside>

  <main class="main">
    <div id="stateArea"></div>

    <div class="card-grid" id="cardGrid"></div>

    <nav class="pagination" id="pagination" aria-label="페이지 네비게이션"></nav>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <div>
        <div class="modal-badges" id="modalBadges"></div>
        <h3 id="modalTitle"></h3>
      </div>
      <button class="modal-close" id="modalClose" aria-label="닫기">&times;</button>
    </div>
    <div class="modal-body">
      <div class="code-block" id="codeBlock">
        <div class="code-block-head">
          <span id="codeBlockLabel">CSS</span>
          <button class="copy-btn" id="modalCopyBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10" stroke="currentColor" stroke-width="2"/></svg>
            복사하기
          </button>
        </div>
        <pre id="modalCode"></pre>
      </div>
      <div class="modal-tip" id="modalTip" hidden>
        <strong>💡 팁</strong>
        <p id="modalTipText"></p>
      </div>
      <img id="modalPreview" class="modal-preview" hidden>
    </div>
  </div>
</div>

<div class="img-lightbox" id="imgLightbox">
  <img id="imgLightboxImg" alt="">
</div>

<div class="toast" id="toast"></div>

<div class="img-tooltip" id="imgTooltip" aria-hidden="true"></div>
<script src="js/app.js"></script>
</body>
</html>
